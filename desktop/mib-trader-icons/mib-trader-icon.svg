<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="letterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7FA"/>
      <stop offset="45%" stop-color="#D7DEE8"/>
      <stop offset="100%" stop-color="#9AA7B8"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="#080B10"/>
  </g>
  <!-- letters as paths approximating Barlow Condensed ExtraBold -->
  <g fill="url(#letterFill)" stroke="#7FD9FF" stroke-width="6" filter="url(#cyanGlow)">
    <!-- M -->
    <path d="M118 268 L118 612 L198 612 L198 392 L292 612 L348 612 L442 392 L442 612 L522 612 L522 268 L424 268 L320 508 L216 268 Z"/>
    <!-- I -->
    <path d="M572 268 L572 612 L662 612 L662 268 Z"/>
    <!-- B -->
    <path d="M722 268 L722 612 L868 612 C930 612 968 574 968 522 C968 486 948 462 918 450 C948 436 964 408 964 372 C964 312 922 268 850 268 Z M802 330 L848 330 C868 330 882 344 882 366 C882 388 868 402 848 402 L802 402 Z M802 470 L858 470 C882 470 898 486 898 512 C898 538 882 550 858 550 L802 550 Z"/>
  </g>
  <!-- candles -->
  <g>
    <!-- left red -->
    <rect x="392" y="742" width="36" height="92" fill="#FF3B56"/>
    <rect x="407" y="708" width="6" height="160" fill="#FF3B56"/>
    <!-- center green -->
    <g filter="url(#greenGlow)">
      <rect x="494" y="708" width="44" height="150" fill="#00F59B"/>
      <rect x="513" y="668" width="6" height="228" fill="#00F59B"/>
    </g>
    <!-- right red -->
    <rect x="596" y="758" width="36" height="76" fill="#FF3B56"/>
    <rect x="611" y="728" width="6" height="136" fill="#FF3B56"/>
  </g>
</svg>
